# Runs tests and type checks. Also called by python-publish.yml before a release.
#
# Actions are pinned to full commit SHAs (version in trailing comment), not tags.
# Tags can be moved to other code, a commit SHA cannot.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and test tools
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest mypy
    - name: Run tests
      run: pytest
    - name: Type check
      run: mypy src
